<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art for Many Waters</title>
<style>
  :root{--paper:#FFFCF2;--ink:#161A17;--soft:#6b665c;--rule:#e2dccd;--go:#1E5E3A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:2rem 1.2rem 4rem}
  h1{font:600 1.4rem/1.2 Georgia,serif;margin:0 0 .3rem}
  .sub{color:var(--soft);font-size:.9rem;margin:0 0 1.8rem}
  .card{border:1px solid var(--rule);border-radius:4px;background:#fff;
        margin:0 0 1.2rem;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;
        border-bottom:1px solid var(--rule);background:#faf7ee}
  .card-head h2{font:600 .95rem/1.3 inherit;margin:0;flex:1}
  .note{color:var(--soft);font-size:.8rem;margin:0}
  button{font:inherit;font-size:.82rem;padding:.4rem .8rem;border-radius:3px;
        border:1px solid var(--rule);background:#fff;cursor:pointer}
  button:hover{border-color:var(--ink)}
  button.primary{background:var(--go);border-color:var(--go);color:#fff}
  .status{color:var(--go);font-size:.8rem;min-width:5.5rem;text-align:right}
  textarea{width:100%;border:0;padding:.9rem;font:13px/1.55 ui-monospace,
        "Cascadia Mono",Consolas,monospace;resize:vertical;background:#fff;
        color:var(--ink);white-space:pre-wrap;word-break:break-word}
  textarea:focus{outline:2px solid var(--go);outline-offset:-2px}
</style></head><body><div class="wrap">
<h1>Art for Many Waters</h1>
<p class="sub">2 to copy. Click Copy, then paste.</p>
<div class="card">
  <div class="card-head"><h2>1 · The table (recommended)</h2><p class="note">783 characters</p>
    <button class="sel">Select all</button>
    <button class="cp primary">Copy</button>
    <span class="status"></span></div>
  <textarea rows="4" spellcheck="false">A heavy old wooden writing table seen from above and a little to one side, a sheet of paper dense with fast flowing handwritten lines in black ink, the ends of the lines running past the edge of the paper and continuing onto the bare wood, older dried lines of the same script covering the table top all around the page, a goose quill laid down in the middle of a line, an open inkwell, the top lines of the page still wet and glistening, a tall brass candlestick with one lit candle standing at the corner of the table and throwing warm light across the wood, a dim room, no person in frame, the script small and illegible, documentary editorial illustration, warm cream paper and deep blue-black ink with a brass accent, soft directional light, grainy film texture --ar 3:2 --v 8.2</textarea>
</div>
<div class="card">
  <div class="card-head"><h2>2 · The road</h2><p class="note">706 characters</p>
    <button class="sel">Select all</button>
    <button class="cp primary">Copy</button>
    <span class="status"></span></div>
  <textarea rows="4" spellcheck="false">A covered horse-drawn carriage halted at midday in the muddy main street of a small 1820s Russian shtetl in late autumn, two mounted officials in dark greatcoats waiting beside it, a crowd of Jewish men in long dark coats and fur-trimmed hats pressed close around the open carriage door listening, some leaning in with a hand cupped behind an ear, seen from behind the crowd so that no face is close and whoever is speaking inside the carriage cannot be seen, bare trees, low wooden houses, wet ground reflecting a pale sky, documentary editorial illustration, warm cream paper and deep blue-black ink with a brass accent, soft directional light, grainy film texture, no lettering, no text --ar 3:2 --v 8.2</textarea>
</div>
</div>
<script>
document.querySelectorAll('.card').forEach(function(card){
  var ta=card.querySelector('textarea'),
      st=card.querySelector('.status'),
      say=function(m){ st.textContent=m; setTimeout(function(){st.textContent='';},2200); };
  card.querySelector('.sel').addEventListener('click',function(){
    ta.focus(); ta.select(); say('selected');
  });
  card.querySelector('.cp').addEventListener('click',function(){
    ta.focus(); ta.select();
    var ok=function(){ say('copied'); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(ok,function(){
        say(document.execCommand('copy')?'copied':'press Ctrl+C');
      });
    } else {
      say(document.execCommand('copy')?'copied':'press Ctrl+C');
    }
  });
});
</script></body></html>
