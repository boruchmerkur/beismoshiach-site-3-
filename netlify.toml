# Netlify config for beismoshiach.org
[build]
  publish = "."

[build.environment]
  LILY_SITE = "beismoshiach"
  # Kept HERE, not in the Netlify UI env. It has been set there twice and
  # disappeared twice — and its absence is silent, because the tracker simply
  # counts everything again with nothing to say it stopped filtering. In this
  # file it is version-controlled, it deploys with the code that reads it, and
  # it cannot be cleared by anything that edits site settings.
  LILY_STRICT_SITES = "beismoshiach"

# v2 functions in netlify/functions are auto-detected and bundled by Netlify's
# own pipeline. Do NOT set node_bundler here -- "esbuild" is the v1 setting and
# forcing it can reject these v2 (export default (req, context) => Response)
# functions for a "missing handler".
[functions]
  directory = "netlify/functions"

# NOTE: the edge function lily-edge is declared INLINE in
# netlify/edge-functions/lily-edge.js via `export const config = { path: '/*' }`.
# It is intentionally NOT declared here as well -- a second [[edge_functions]]
# block would double-register it and can fail the deploy.

# NO /api/lily redirect here on purpose.
# lily-collect is a v2 function that already claims /api/lily via its inline
# `export const config = { path: '/api/lily' }`, so it is served AT /api/lily
# directly. A v2 function with a custom path is NOT exposed at the legacy
# /.netlify/functions/lily-collect URL -- so a forced redirect pointing there
# rewrote every /api/lily request to a dead URL and returned 404. That redirect
# was added 2026-07-21 and is exactly when this site stopped reporting.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://dreamsitedesign.com https://cdnjs.cloudflare.com; connect-src 'self' https://dreamsitedesign.com; frame-src https://www.moshiach101.info https://moshiach101.info; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Netlify Image CDN, for /science/. The wire hands back pictures hosted by the
# outlet that published them, and this page asks for each at the size its slot
# needs rather than letting the browser scale whatever the feed gave.
#
# THIS LIST IS AN ALLOW-LIST. A host that is not matched here is refused by
# /.netlify/images and the picture falls back to the source URL, then to no
# picture at all. Add the host when you add a feed to netlify/functions/wire.js.
#
# The patterns are ([a-z0-9-]+\.)*host so they match with OR without a
# subdomain: most WordPress feeds serve uploads off the bare domain, and a
# pattern requiring one silently refused nearly every host.
[images]
  remote_images = [
    "https://([a-z0-9-]+\\.)*b-cdn\\.net/.*",
    "https://([a-z0-9-]+\\.)*phys\\.org/.*",
    "https://([a-z0-9-]+\\.)*quantamagazine\\.org/.*",
    "https://([a-z0-9-]+\\.)*sciencedaily\\.com/.*",
    "https://([a-z0-9-]+\\.)*futurecdn\\.net/.*",
    "https://([a-z0-9-]+\\.)*livescience\\.com/.*",
    "https://([a-z0-9-]+\\.)*newscientist\\.com/.*",
    "https://([a-z0-9-]+\\.)*nasa\\.gov/.*",
    "https://([a-z0-9-]+\\.)*sciencenews\\.org/.*",
    "https://([a-z0-9-]+\\.)*arstechnica\\.net/.*",
    "https://([a-z0-9-]+\\.)*blogspot\\.com/.*",
    "https://([a-z0-9-]+\\.)*googleusercontent\\.com/.*",
    "https://([a-z0-9-]+\\.)*ggpht\\.com/.*",
    "https://([a-z0-9-]+\\.)*anash\\.org/.*",
    "https://([a-z0-9-]+\\.)*collive\\.com/.*",
    "https://([a-z0-9-]+\\.)*crownheights\\.info/.*",
    "https://([a-z0-9-]+\\.)*chabad\\.org/.*",
    "https://([a-z0-9-]+\\.)*wp\\.com/.*",
    "https://([a-z0-9-]+\\.)*cloudfront\\.net/.*",
    "https://([a-z0-9-]+\\.)*wordpress\\.com/.*"
  ]

# --- pwaify:start — do not hand-edit, re-run pwaify.py ---
# The worker must revalidate on every load, or a CDN copy can pin users to an
# old version forever.  The manifest is cheap to recheck; icons are immutable
# in practice but change name-free, so keep them short-lived.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"
# --- pwaify:end ---
