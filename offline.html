<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Beis Moshiach</title>
<meta name="theme-color" content="#0042AF">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  html,body{height:100%;margin:0}
  body{background:#F0E3CF;color:#2b2a22;display:grid;place-items:center;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:24px;text-align:center}
  .card{max-width:26rem}
  img{width:72px;height:72px;border-radius:18px;margin:0 auto 20px;display:block}
  h1{font-size:1.35rem;margin:0 0 .5rem;letter-spacing:-.01em}
  p{margin:0 0 1.5rem;opacity:.7}
  button{font:600 15px/1 inherit;padding:12px 22px;border:0;border-radius:999px;
         background:#0042AF;color:#FDCB40;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so there's no saved copy.
     Pages you've already visited still work without a connection.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
