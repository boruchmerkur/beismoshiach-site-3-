<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comment moderation — beismoshiach.org</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  .mod{max-width:820px;margin:40px auto;padding:0 20px;font-family:var(--display),Georgia,serif}
  .mod h1{font-size:24px;color:var(--royal);margin:0 0 6px}
  .mod .sub{color:var(--ink-soft,#666);margin:0 0 24px;font-size:14px}
  .mod-key{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
  .mod-key input{flex:1 1 260px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--parchment-edge);border-radius:5px;background:var(--surface,#fff);color:var(--ink,#1a1a1a)}
  .mod-key button{font:inherit;font-size:15px;font-weight:500;color:#fff;background:var(--royal);border:none;border-radius:5px;padding:10px 20px;cursor:pointer}
  .mod-key button:hover{opacity:.9}
  .mod-status{font-size:14px;color:var(--royal);min-height:20px;margin-bottom:18px}
  .mod-art{border:1px solid var(--parchment-edge);border-radius:7px;background:var(--parchment-deep);margin:0 0 16px;overflow:hidden}
  .mod-art>h2{font-size:16px;margin:0;padding:12px 16px;border-bottom:1px solid var(--rule);background:rgba(0,0,0,.02)}
  .mod-art>h2 a{color:var(--royal);text-decoration:none}
  .mod-art>h2 a:hover{text-decoration:underline}
  .mod-art .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-soft,#666);font-weight:400;margin-left:8px}
  .mod-c{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--rule)}
  .mod-c:last-child{border-bottom:none}
  .mod-c .body{flex:1}
  .mod-c .who{font-weight:600}
  .mod-c .when{font-family:var(--mono);font-size:11px;color:var(--royal);opacity:.75;margin-left:8px}
  .mod-c p{margin:5px 0 0;line-height:1.5;white-space:pre-wrap}
  .mod-c button{font:inherit;font-size:13px;color:#a12;background:transparent;border:1px solid #d99;border-radius:4px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .mod-c button:hover{background:#a12;color:#fff}
  .mod-empty{color:var(--ink-soft,#666);font-style:italic}
</style>
</head>
<body>
<div class="mod">
  <h1>Comment moderation</h1>
  <p class="sub">Private. Enter your admin key to view and remove comments across all articles.</p>
  <div class="mod-key">
    <input id="key" type="password" placeholder="Admin key" autocomplete="off">
    <button id="load">Load comments</button>
  </div>
  <div class="mod-status" id="status"></div>
  <div id="list"></div>
</div>
<script>
(function () {
  var keyEl = document.getElementById("key");
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var saved = sessionStorage.getItem("bm_admin_key");
  if (saved) keyEl.value = saved;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function when(ts) { try { return new Date(ts).toLocaleString(); } catch (e) { return ""; } }

  function load() {
    var key = keyEl.value.trim();
    if (!key) { statusEl.textContent = "Enter your admin key."; return; }
    sessionStorage.setItem("bm_admin_key", key);
    statusEl.textContent = "Loading…";
    fetch("/api/comments?all=1", { headers: { "x-admin-key": key } })
      .then(function (r) {
        if (r.status === 401) throw new Error("Wrong key (or COMMENTS_ADMIN_KEY not set in Netlify).");
        return r.json();
      })
      .then(function (d) { render(d.items || []); })
      .catch(function (e) { statusEl.textContent = e.message || "Failed to load."; });
  }

  function render(items) {
    var total = items.reduce(function (n, it) { return n + it.comments.length; }, 0);
    statusEl.textContent = items.length
      ? total + " comment" + (total === 1 ? "" : "s") + " across " + items.length + " article" + (items.length === 1 ? "" : "s") + "."
      : "";
    if (!items.length) { listEl.innerHTML = '<p class="mod-empty">No comments yet.</p>'; return; }
    listEl.innerHTML = items.map(function (it) {
      var rows = it.comments.map(function (c) {
        return '<div class="mod-c" data-id="' + esc(c.id) + '"><div class="body">' +
          '<span class="who">' + esc(c.name || "Anonymous") + '</span>' +
          '<span class="when">' + when(c.ts) + '</span>' +
          '<p>' + esc(c.body || "") + '</p></div>' +
          '<button data-slug="' + esc(it.slug) + '" data-id="' + esc(c.id) + '">Delete</button></div>';
      }).join("");
      var href = "/articles/" + encodeURIComponent(it.slug) + ".html";
      return '<div class="mod-art"><h2><a href="' + href + '" target="_blank" rel="noopener">' +
        esc(it.slug) + '</a><span class="cnt">' + it.comments.length + '</span></h2>' + rows + '</div>';
    }).join("");
  }

  listEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-id]");
    if (!btn) return;
    if (!confirm("Delete this comment permanently?")) return;
    var key = keyEl.value.trim();
    btn.disabled = true; btn.textContent = "…";
    fetch("/api/comments?slug=" + encodeURIComponent(btn.dataset.slug) + "&id=" + encodeURIComponent(btn.dataset.id),
      { method: "DELETE", headers: { "x-admin-key": key } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || "error");
        var row = btn.closest(".mod-c");
        var art = btn.closest(".mod-art");
        row.remove();
        if (art && !art.querySelector(".mod-c")) art.remove();
      })
      .catch(function () { btn.disabled = false; btn.textContent = "Delete"; alert("Could not delete."); });
  });

  document.getElementById("load").addEventListener("click", load);
  keyEl.addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
})();
</script>
</body>
</html>
